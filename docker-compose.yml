version: '3.8'

# Production configuration (uses nginx-based Dockerfile)
# For development with hot reload, use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile  # Production: nginx serves static files
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:3000
      - VITE_DATA_SOURCE=http
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - arch-decisions-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/data:/app/data
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
      - ./backend/node_modules:/app/node_modules
      - ./backend/jest.config.js:/app/jest.config.js
    depends_on:
      - redis
    networks:
      - arch-decisions-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run worker:dev
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: ${REDIS_URL}
      SKIP_DB_MIGRATIONS: "1"
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/data:/app/data
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
      - ./backend/node_modules:/app/node_modules
    depends_on:
      - redis
      - backend
    networks:
      - arch-decisions-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - arch-decisions-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - arch-decisions-network

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    env_file:
      - ./backend-python/.env
    environment:
      REDIS_URL: ${REDIS_URL}
      # Built from root .env so the password is not hardcoded in compose.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend-python:/app
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - arch-decisions-network

  worker-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    command: celery -A arch_decisions.worker.celery_app worker --loglevel=INFO --concurrency=2
    env_file:
      - ./backend-python/.env
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SKIP_DB_MIGRATIONS: "1"
    volumes:
      - ./backend-python:/app
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      backend-python:
        condition: service_started
    networks:
      - arch-decisions-network

volumes:
  postgres_data:

networks:
  arch-decisions-network:
    driver: bridge
