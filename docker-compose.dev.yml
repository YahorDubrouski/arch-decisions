version: '3.8'

# Development override - use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# Only contains overrides - base configuration is in docker-compose.yml

services:
  frontend:
    # Override: Use development Dockerfile (Node.js + Vite dev server instead of nginx)
    build:
      context: ./frontend
      dockerfile: DockerfileDev
    # Override: Use Vite dev server port (replaces production 3000:80)
    ports:
      - "5174:5173"
    # Bind host frontend for hot reload; keep container node_modules (not host)
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Override: Use localhost for API URL in dev
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_DATA_SOURCE=http

  backend:
    # Override: Use tsx watch for hot reload
    command: npm run dev

  worker:
    # Override: tsx watch so source mounts are live (base Dockerfile still builds dist for start)
    command: npm run worker:dev

  backend-python:
    # Hot reload for FastAPI during development (--factory avoids import-time DB boot)
    command: uvicorn arch_decisions.main:create_app --factory --host 0.0.0.0 --port 3000 --reload

  worker-python:
    command: celery -A arch_decisions.worker.celery_app worker --loglevel=INFO --concurrency=2
